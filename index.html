<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Q ร้านตั้ม - เช็คคิวงาน</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --pink-main: #ff9ebb;
            --pink-soft: #ffc2d4;
            --pink-light: #ffe5ec;
            --pink-bg: #fff0f5;
            --pink-deep: #e05297;
            --white-glass: rgba(255, 255, 255, 0.85);
            --text-color: #5a3e4d;
            --card-shadow: 0 10px 30px rgba(230, 100, 150, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Mali', sans-serif;
        }

        body {
            background-color: var(--pink-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 218, 224, 0.5) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(255, 240, 245, 1) 0%, rgba(255, 222, 233, 0.6) 100%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        /* --- Header Section with Cat Fur Texture Effect --- */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            border: 2px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,192,203,0.3) 0%, transparent 60%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Cat Fur Textured Text */
        .fur-title-container {
            position: relative;
            z-index: 1;
            display: inline-block;
        }

        .fur-title {
            font-family: 'Mali', cursive;
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #e05297 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
            filter: drop-shadow(2px 4px 6px rgba(224, 82, 151, 0.2));
        }

        .fur-title::after {
            content: 'Check Q ร้านตั้ม';
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            background: repeating-linear-gradient(
                45deg,
                #ffb6c1,
                #ffb6c1 2px,
                #ff69b4 2px,
                #ff69b4 4px,
                #ff1493 4px,
                #ff1493 5px
            );
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3;
            filter: blur(1px);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            background: #fff;
            display: inline-block;
            padding: 8px 22px;
            border-radius: 50px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #d84374;
            box-shadow: 0 4px 15px rgba(255, 158, 187, 0.3);
            border: 1px dashed var(--pink-soft);
        }

        /* --- Controls (Search & Filter) --- */
        .controls-card {
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 50px;
            border: 2px solid var(--pink-soft);
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
        }

        .search-box input:focus {
            border-color: var(--pink-deep);
            box-shadow: 0 0 10px rgba(224, 82, 151, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--pink-main);
            font-size: 1.1rem;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: none;
            background: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-color);
            border: 1px solid var(--pink-soft);
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--pink-main);
            color: white;
            border-color: var(--pink-main);
            box-shadow: 0 4px 10px rgba(255, 158, 187, 0.4);
        }

        /* --- Table Section --- */
        .table-card {
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            padding: 10px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        th {
            padding: 15px;
            color: var(--pink-deep);
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            border-bottom: 2px solid var(--pink-light);
        }

        tbody tr {
            background: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border-radius: 15px;
        }

        tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 158, 187, 0.25);
        }

        td {
            padding: 16px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        td:first-child {
            border-top-left-radius: 15px;
            border-bottom-left-radius: 15px;
            font-weight: 700;
            color: var(--pink-deep);
            text-align: center;
            width: 70px;
        }

        td:last-child {
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-waiting {
            background-color: #fff4e6;
            color: #d9480f;
            border: 1px solid #ffd8a8;
        }

        .badge-doing {
            background-color: #e7f5ff;
            color: #1971c2;
            border: 1px solid #a5d8ff;
        }

        .badge-done {
            background-color: #ebfbee;
            color: #2b8a3e;
            border: 1px solid #b2f2bb;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 40px;
            color: #b08294;
        }

        /* --- Footer Section (ช่องทางติดต่อ) --- */
        footer {
            margin-top: 40px;
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 -10px 30px rgba(230, 100, 150, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .footer-title {
            font-family: 'Mali', cursive;
            color: var(--pink-deep);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-card {
            background: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.88rem;
            border: 1px solid var(--pink-soft);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 158, 187, 0.3);
            border-color: var(--pink-main);
            color: var(--pink-deep);
        }

        .contact-card i {
            font-size: 1.2rem;
        }

        .contact-card.facebook i { color: #1877f2; }
        .contact-card.line i { color: #06c755; }
        .contact-card.group i { color: #ff6b6b; }

        .copyright {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #c49ba9;
        }

        @media (max-width: 600px) {
            .fur-title { font-size: 2.2rem; }
            .subtitle { font-size: 0.8rem; }
            td, th { padding: 12px 10px; font-size: 0.82rem; }
            .badge { padding: 4px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="fur-title-container">
                <h1 class="fur-title">Check Q ร้านตั้ม</h1>
            </div>
            <br>
            <div class="subtitle">
                <i class="fa-solid fa-heart" style="color: #ff69b4; margin-right: 5px;"></i>
                หากท่านใดที่สั่งงานกับเราไม่ขึ้นชื่อทักทางส่วนตัวได้เลยค่ะ
            </div>
        </header>

        <!-- Search & Filter Bar -->
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่อลูกค้า เพื่อค้นหาคิว..." onkeyup="filterData()">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('all', this)">ทั้งหมด</button>
                <button class="filter-btn" onclick="setFilter('รอคิว', this)">รอคิว</button>
                <button class="filter-btn" onclick="setFilter('กำลัง', this)">กำลังทำ</button>
                <button class="filter-btn" onclick="setFilter('เสร็จ', this)">เสร็จแล้ว</button>
            </div>
        </div>

        <!-- Queue Table -->
        <div class="table-card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="text-align: center;">ลำดับ</th>
                            <th>ชื่อลูกค้า / งาน</th>
                            <th>รายละเอียด</th>
                            <th style="text-align: center;">สถานะ</th>
                            <th>วันที่รับงาน</th>
                        </tr>
                    </thead>
                    <tbody id="queueTableBody">
                        <tr>
                            <td colspan="5" class="loading-state">
                                <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--pink-main); margin-bottom: 10px;"></i>
                                <p>กำลังดึงข้อมูลคิวงานแบบ Real-time...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer (ช่องทางติดต่อ) -->
    <footer>
        <div class="footer-title">🌸 ช่องทางการติดต่อ 🌸</div>
        <div class="contact-links">
            <a href="https://facebook.com" target="_blank" class="contact-card facebook">
                <i class="fa-brands fa-facebook"></i>
                <span>Facebook : ร้านตั้ม</span>
            </a>
            <a href="https://line.me" target="_blank" class="contact-card line">
                <i class="fa-brands fa-line"></i>
                <span>Line Official</span>
            </a>
            <a href="#" target="_blank" class="contact-card group">
                <i class="fa-solid fa-user-group"></i>
                <span>กลุ่มที่แอดมินดูแล</span>
            </a>
        </div>
        <div class="copyright">
            © Check Q ร้านตั้ม - บริการเช็คคิวงานออนไลน์
        </div>
    </footer>

    <script>
        // ลิงก์เชื่อมต่อ Google Sheets ของคุณแบบ Real-time
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/16WelSbS8RP3S2ee8rrEOcxEbe5uKkkcZGNxIUk_jR1c/export?format=csv";

        let allData = [];
        let currentStatusFilter = 'all';

        async function fetchRealtimeQueue() {
            try {
                // ใส่ตัวแปร t ป้องกันเบราว์เซอร์จำแคช เพื่อให้ดึงข้อมูลสดใหม่ Real-time ทุกครั้ง
                const response = await fetch(GOOGLE_SHEET_CSV_URL + '&t=' + new Date().getTime());
                const csvText = await response.text();
                allData = parseCSV(csvText);
                filterData();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('queueTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; color: #ff6b6b; margin-bottom: 10px;"></i>
                            <p>ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการตั้งค่าใน Google Sheets</p>
                        </td>
                    </tr>
                `;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            const result = [];
            
            // ข้ามแถวที่ 1 (Header)
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
                if (row.length >= 4 && row[1]) {
                    result.push({
                        id: row[0] || (i),
                        name: row[1] || '-',
                        detail: row[2] || '-',
                        status: row[3] || 'รอคิว',
                        date: row[4] || '-'
                    });
                }
            }
            return result;
        }

        function renderTable(data) {
            const tbody = document.getElementById('queueTableBody');
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i>
                            <p>ไม่พบรายการคิวงาน</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => {
                let badgeClass = 'badge-waiting';
                let statusText = item.status;

                if (statusText.includes('กำลัง') || statusText.includes('ทำ')) {
                    badgeClass = 'badge-doing';
                } else if (statusText.includes('เสร็จ')) {
                    badgeClass = 'badge-done';
                }

                return `
                    <tr>
                        <td style="text-align: center;">#${item.id}</td>
                        <td style="font-weight: 600;">${item.name}</td>
                        <td>${item.detail}</td>
                        <td style="text-align: center;">
                            <span class="badge ${badgeClass}">${statusText}</span>
                        </td>
                        <td style="color: #888;">${item.date}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchText) || 
                                      item.detail.toLowerCase().includes(searchText);
                
                let matchesStatus = true;
                if (currentStatusFilter !== 'all') {
                    matchesStatus = item.status.includes(currentStatusFilter);
                }

                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        }

        function setFilter(status, btnElement) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterData();
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ และอัปเดตแบบ Real-time ทุกๆ 10 วินาที
        window.onload = () => {
            fetchRealtimeQueue();
            setInterval(fetchRealtimeQueue, 10000);
        };
    </script>
</body>
</html>
